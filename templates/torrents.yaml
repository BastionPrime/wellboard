id: torrents
name: "Торренты — напрямую"
description: "Уводит торрент-трекеры напрямую, минуя VPN (DIRECT): публичные трекеры и RuTracker. Строгость ограниченная и честная: матч идёт по доменам трекеров — по приложению (процессу) на роутере определить нельзя, поэтому сами раздачи этим правилом не покрываются."
list_source: "geosite.dat выбранного источника геоданных (категории CATEGORY-PUBLIC-TRACKER, RUTRACKER). Локального резерва нет: при недоступных геоданных правило не сработает. Список обновляет mihomo/nikki."
typical_target: direct
conditions:
  - {type: geosite, value: CATEGORY-PUBLIC-TRACKER}
  - {type: geosite, value: RUTRACKER}
