id: ads-block
name: "Реклама и трекеры — блок"
description: "Блокирует рекламные и трекерные домены: правило REJECT, такой трафик отбрасывается. Всё остальное проходит как обычно. Строгость высокая, но список узкий — режет только известные рекламные и аналитические домены, поэтому это самый безопасный старт."
list_source: "geosite.dat выбранного источника геоданных (по умолчанию runetfreedom), категория CATEGORY-ADS-ALL; локальный резерв — встроенный providers/ads.yaml, 22 домена (срез 19.09.2026). Список обновляет mihomo/nikki, приложение только проверяет доступность источника."
typical_target: reject
conditions:
  - {type: geosite, value: CATEGORY-ADS-ALL}
providers:
  - ads
