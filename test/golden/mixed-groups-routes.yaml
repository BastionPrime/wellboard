      type: trojan
proxy-groups:
    - name: Pick
      proxies:
        - NL-1 [WellDone]
        - NL-2 [Вручную]
      type: select
    - interval: 300
      name: Auto
      proxies:
        - NL-1 [WellDone]
        - Pick
      tolerance: 50
      type: url-test
      url: https://www.gstatic.com/generate_204
    - interval: 300
      name: Chain
      proxies:
        - NL-2 [Вручную]
        - NL-1 [WellDone]
      type: fallback
      url: https://www.gstatic.com/generate_204
    - interval: 300
      name: Balanced
      proxies:
        - Pick
        - NL-1 [WellDone]
      type: load-balance
      url: https://www.gstatic.com/generate_204
    - interval: 60
      name: rt:rt_geo
      proxies:
        - Chain
        - REJECT
      type: fallback
      url: https://www.gstatic.com/generate_204
    - interval: 60
      name: rt:rt_mix
      proxies:
        - Auto
        - REJECT
      type: fallback
      url: https://www.gstatic.com/generate_204
    - interval: 60
      name: rt:rt_dir
      proxies:
        - DIRECT
      type: fallback
      url: https://www.gstatic.com/generate_204
    - name: rt:default
      proxies:
        - DIRECT
      type: select
rule-providers: {}
rules:
