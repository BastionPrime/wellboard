# WellBoard build matrix: cross-compile + OpenWrt packages (.ipk/.apk).
#
# NOTE: this workflow is written but NOT exercised — the repo remote is
# a local bare repo (docs/DECISIONS.md RK4); local verification runs
# `make cross` + the root Makefile docker targets on the dev host.
# The matrix below mirrors exactly what make cross does locally.

name: build-matrix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_IMAGE: golang:1.23-alpine
  # Version comes from the repo-root VERSION file (asserted below); the
  # packaging Makefiles carry the same value for buildroot users.
  PKG_RELEASE: '1'

jobs:
  build:
    name: build (${{ matrix.openwrt_arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt_arch: aarch64_cortex-a53
            goarch: arm64
            goarm: ''
            gomips: ''
          - openwrt_arch: aarch64_generic
            goarch: arm64
            goarm: ''
            gomips: ''
          - openwrt_arch: x86_64
            goarch: amd64
            goarm: ''
            gomips: ''
          - openwrt_arch: arm_cortex-a7_neon-vfpv4
            goarch: arm
            goarm: '7'
            gomips: ''
          - openwrt_arch: mipsel_24kc
            goarch: mipsle
            goarm: ''
            gomips: softfloat

    steps:
      - uses: actions/checkout@v4

      - name: Packaging toolchains (real apk-tools 3 + opkg ipkg-build)
        run: |
          # Single source of truth for the release version.
          echo "PKG_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
          # GNU tar + binutils ar: ipkg-build requires both (busybox tar
          # silently produces empty archives, busybox ar cannot create).
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils
          # ipkg-build is the script the OpenWrt buildroot itself uses to
          # pack .ipk; take it from the openwrt tree instead of
          # hand-rolling an ar/tar archive.
          curl -fsSL -o scripts/ipkg-build \
            https://raw.githubusercontent.com/openwrt/openwrt/master/scripts/ipkg-build
          chmod +x scripts/ipkg-build

      - name: Cross-compile wellboard (docker golang:1.23-alpine)
        run: |
          docker run --rm -v "$PWD":/app -w /app \
            -e CGO_ENABLED=0 \
            -e GOOS=linux \
            -e GOARCH=${{ matrix.goarch }} \
            -e GOARM=${{ matrix.goarm }} \
            -e GOMIPS=${{ matrix.gomips }} \
            -e GOCACHE=/tmp/gocache \
            -e GOPATH=/tmp/gopath \
            $GO_IMAGE \
            go build -trimpath -ldflags="-s -w -X main.version=$PKG_VERSION" \
              -o .build/wellboard-linux-${{ matrix.goarch }} ./cmd/wellboard
          file .build/wellboard-linux-${{ matrix.goarch }}

      - name: Stage prebuilt binary for the OpenWrt package
        run: |
          mkdir -p packaging/openwrt/prebuilt
          cp .build/wellboard-linux-${{ matrix.goarch }} \
             packaging/openwrt/prebuilt/wellboard

      - name: Build .ipk package (real opkg toolchain - ipkg-build)
        env:
          IPKG_BUILD: ${{ github.workspace }}/scripts/ipkg-build
        run: |
          # scripts/package-ipk.sh refuses to run without ipkg-build:
          # a hand-made ar archive is deliberately not produced.
          scripts/package-ipk.sh \
            wellboard $PKG_VERSION ${{ matrix.openwrt_arch }} \
            packaging/openwrt/prebuilt/wellboard
          scripts/package-ipk.sh \
            luci-app-wellboard $PKG_VERSION all \
            packaging/openwrt/luci-app-wellboard

      - name: Build .apk package (real apk-tools 3 - apk mkpkg)
        run: |
          # scripts/package-apk.sh uses apk mkpkg (apk-tools 3): the
          # package container and metadata come from apk itself, not
          # from a hand-rolled tarball.
          scripts/package-apk.sh \
            wellboard $PKG_VERSION ${{ env.PKG_RELEASE }} \
            ${{ matrix.openwrt_arch }} \
            packaging/openwrt/prebuilt/wellboard
          scripts/package-apk.sh \
            luci-app-wellboard $PKG_VERSION ${{ env.PKG_RELEASE }} \
            all packaging/openwrt/luci-app-wellboard

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wellboard-${{ matrix.openwrt_arch }}
          path: |
            dist/*.ipk
            dist/*.apk
          if-no-files-found: error
