# WellBoard CI: lint + test on every push/PR to main.
#
# Toolchain note (docs/DECISIONS.md D3): the module targets go 1.22
# (go.mod directive) while the local docker build/test image is
# golang:1.23-alpine. Here actions/setup-go pins 1.22 to match go.mod —
# i.e. CI intentionally builds with the OLDER of the two toolchains, and
# the docker image (1.23) serves as the dev-host fallback that also
# satisfies the 1.22 directive.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt: files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
